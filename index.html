async function api(prompt, max=1000) {
  if(!API_KEY) throw new Error('NO_KEY');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:max,system:SYS,messages:[{role:'user',content:prompt}]})
  });
  if(!r.ok) throw new Error('API_'+r.status);
  const d = await r.json();
  return d.content?.[0]?.text||'';
}

async function apiChat(msgs) {

// COPY SYSTEM
// ═══════════════════════════════════════════════
let _ps={},_pi=0;
function pc(text,accent,src,slot){
  const id='p'+(_pi++);
  _ps[id]={text,src,slot};
  return `<div class="pc" style="border-color:${accent}30" onclick="doCopy('${id}','${accent}',this);return false;">
    <div class="tx">${esc(text)}</div>
    <div class="ac" style="color:#666">TAP TO COPY</div>
  </div>`;
}
function doCopy(id,accent,el){
  const p=_ps[id];if(!p)return;
  copyText(p.text);
  arcAdd(p.text,p.src,p.slot);
  el.style.borderColor=accent;
  const ac=el.querySelector('.ac');
  ac.textContent='COPIED ✓';
  ac.style.color=accent;
  ac.style.fontWeight='900';
  // Reset after 3s so user can copy again
  setTimeout(()=>{ac.textContent='TAP TO COPY';ac.style.color='#666';ac.style.fontWeight='400';el.style.borderColor=accent+'30'},3000);
}
function copyText(text){
  // Method 1: Modern clipboard API (needs secure context)
  let done=false;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{navigator.clipboard.writeText(text);done=true}catch(e){}
  }
  // Method 2: Always also try execCommand as fallback/backup
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    // iOS needs special handling
    if(navigator.userAgent.match(/ipad|iphone/i)){
      const range=document.createRange();
      range.selectNodeContents(ta);
      const sel=window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ta.setSelectionRange(0,999999);
    } else {
      ta.select();
    }
    document.execCommand('copy');
    document.body.removeChild(ta);
    done=true;
  }catch(e){}
  if(!done) console.warn('Copy failed - both methods');
}

async function gen(key, prompt, accent, src, slot, count=3){
  if(!API_KEY){alert('Set your API key first (⚙ button)');return}
  genBusy[key]=true; genRes[key]=[]; R();
  try{
    const raw = await api(prompt);
    genRes[key] = raw.split('---').map(s=>s.trim()).filter(Boolean).slice(0,count);
  }catch(e){genRes[key]=[`⚠ Error: ${e.message}`]}
  genBusy[key]=false; R();
}

function showGen(key,accent,src,slot){
  if(!genRes[key]||!genRes[key].length) return '';
  return `<div class="rs"><div class="src" style="color:${accent}">⚡ RAY SAYS: — EDIT BEFORE POSTING</div>${genRes[key].map(t=>pc(t,accent,src,slot)).join('')}</div>`;
}

async function doReply(){
  if(!replyIn.trim())return;
  if(!API_KEY){alert('Set your API key first');return}
  const m=RMOOD[replyMood];
  replyBusy=true;replyRes=[];replySrc='';R();
  try{
    const text=await api(`You are replying to this tweet/post:\n\n"${replyIn}"\n\nGenerate 3 distinct replies in the ${m.m} angle.\n\nANGLE RULES:\n- AGREE + ADD: Agree, then add a deeper/sharper layer. Don't just validate — extend.\n- COUNTER: Push back with PHR logic. Not hostile — precise. Find what the post misses.\n- PHR LENS: Reframe through Post-Hype Realism philosophy. Name the principle at work.\n- SHARP + SHORT: 1-3 sentences max. No explanation. Just the thing.\n\nEach reply ends with F.B.T.S. and #RaySignal (PHR LENS adds #PostHypeRealism or #TheHonestFake).\n\nSeparate with ---. No numbering, no preamble. Just the 3 replies.`);
    const split=text.split('---').map(s=>s.trim()).filter(Boolean);
    if(split.length>0){replyRes=split.slice(0,3);replySrc='api'}
  }catch(e){replyRes=[`⚠ ${e.message}`];replySrc='error'}
  replyBusy=false;R();
}

function pChat(){
  let h=`<div class="pnl" style="min-height:60vh">${sh('PHR KNOWLEDGE CHAT','💬','#00FF88')}`;
  if(!API_KEY){h+=noKey();h+=`</div>`;return h}

  h+=`<div id="cc" style="max-height:50vh;overflow-y:auto;margin-bottom:12px">`;
  if(!chatMsgs.length) h+=`<div class="cm s">PHR Knowledge System online. Full canon loaded. Ask anything.</div>`;
  chatMsgs.forEach(m=>{h+=`<div class="cm ${m.r==='user'?'u':'a'}">${esc(m.c)}</div>`});
  if(chatBusy) h+=`<div class="loading">⚡ PROCESSING SIGNAL...</div>`;
  h+=`</div>`;
  h+=`<div class="cr"><input class="ti" type="text" id="ci" placeholder="Ask the PHR system..." onkeydown="if(event.key==='Enter')doChat()"><button onclick="doChat()" ${chatBusy?'disabled':''}>SEND</button></div>`;
  h+=`<button class="cb s" style="border-color:#333;color:#555;margin-top:8px" onclick="chatMsgs=[];R()">CLEAR</button>`;
  h+=`</div>`;
  return h;
}

async function doChat(){
  const i=document.getElementById('ci');
  if(!i||!i.value.trim()||chatBusy)return;
  chatMsgs.push({r:'user',c:i.value.trim()});
  chatBusy=true;R();
  try{
    const msgs=chatMsgs.map(m=>({role:m.r==='user'?'user':'assistant',content:m.c}));
    const reply=await apiChat(msgs);
    chatMsgs.push({r:'assistant',c:reply});
  }catch(e){chatMsgs.push({r:'assistant',c:'⚠ '+e.message})}
  chatBusy=false;R();
}
