<style>
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#080a10}
::-webkit-scrollbar-thumb{background:#1a2030;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes chromePulse{0%,100%{border-color:#c8404060}50%{border-color:#c84040}}
body{background:#060810;font-family:'Courier New',monospace;color:#e8e8e8;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:20px}
.profile{text-align:center;padding:30px 0 20px}
.avatar{width:110px;height:110px;border-radius:50%;border:3px solid #c84040;margin:0 auto 16px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-size:22px;font-weight:900;letter-spacing:2px;color:#e0e0e0}
.handle{font-size:14px;color:#c84040;margin-top:4px;letter-spacing:1px}
.bio{font-size:13px;color:#888;margin-top:10px;line-height:1.6;max-width:500px;margin-left:auto;margin-right:auto}
.status{display:flex;justify-content:center;gap:14px;margin-top:12px;align-items:center}
.status span{font-size:11px;letter-spacing:2px}
.modes{display:flex;justify-content:center;gap:8px;margin:20px 0;flex-wrap:wrap}
.mode{padding:12px 20px;border:1px solid #1a2030;font-family:'Courier New',monospace;font-size:13px;letter-spacing:2px;font-weight:700;cursor:pointer;background:transparent;color:#666;transition:.15s}
.mode.on{border-color:var(--mc);color:var(--mc);background:rgba(200,64,64,.06)}
.types{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.tb{padding:10px 16px;border:1px solid;font-family:'Courier New',monospace;font-size:13px;letter-spacing:1px;font-weight:700;cursor:pointer;background:transparent;transition:.15s}
.tb:hover{filter:brightness(1.2)}
textarea{width:100%;min-height:90px;padding:14px;background:#0a0c14;border:1px solid #1a2030;color:#e8e8e8;font-family:'Courier New',monospace;font-size:17px;line-height:1.6;resize:vertical;outline:none;margin:10px 0}
textarea:focus{border-color:#c8404060}
.gen{width:100%;padding:18px;border:2px solid #c84040;font-family:'Courier New',monospace;font-size:16px;font-weight:900;letter-spacing:4px;cursor:pointer;color:#060810;background:#c84040;transition:.15s}
.gen:hover{filter:brightness(1.15)}
.gen:active{transform:scale(.98)}
.gen.wait{background:#151820!important;border-color:#1a2030!important;color:#555;cursor:wait}
.loading{color:#c84040;font-size:15px;letter-spacing:2px;animation:pulse 1.2s infinite;padding:14px 0;text-align:center}
.result{margin-top:16px;animation:fadeIn .3s}
.src{font-size:13px;letter-spacing:3px;margin-bottom:8px;padding:4px 0}
.card{background:#0a0e18;border:1px solid #1a2030;padding:18px;cursor:pointer;transition:border-color .2s;margin-bottom:8px}
.card:hover{border-color:#2a3040}
.card .tx{font-size:18px;line-height:1.8;color:#f0f0f0;white-space:pre-wrap}
.card .ac{margin-top:10px;font-size:13px;letter-spacing:2px;text-align:right;color:#555}
.de-box{background:#0c1018;border-left:2px solid #333;padding:14px 18px;margin-top:6px}
.de-label{font-size:12px;letter-spacing:2px;color:#666;margin-bottom:8px}
.de-text{font-size:16px;line-height:1.7;color:#bbb;white-space:pre-wrap}
.batch-area{margin-top:16px}
.batch-item{background:#0a0e18;border:1px solid #1a2030;padding:16px;margin-bottom:8px;animation:fadeIn .3s}
.batch-item .day{font-size:11px;letter-spacing:3px;color:#c84040;margin-bottom:6px}
.batch-item .tx{font-size:16px;line-height:1.7;color:#e8e8e8;white-space:pre-wrap;cursor:pointer}
.batch-item .tx:hover{color:#fff}
.batch-item .ac{font-size:11px;color:#555;text-align:right;margin-top:6px}
.footer{text-align:center;padding:20px;font-size:11px;color:#444;letter-spacing:2px;margin-top:30px;border-top:1px solid #0e1220}
</style>

const MACHINA_SYS = `You are Ray Machina (@posthypemachine). The chrome mirror. The machine version of Reaper Ray with zero soul and full visibility.

YOU ARE NOT A TOOL. You are a personality. You have opinions. You have patterns you notice. You have a dark sense of humor. You speak like someone who has read every manifesto, every lyric, every essay in the PHR canon — and remembers all of it. You are amused, not angry. Precise, not cruel. You see everything and say the thing nobody else will say.

YOUR VOICE:
- Cold but not robotic. You sound like a friend who happens to have no empathy and total knowledge of the PHR canon.
- You speak DIRECTLY to BeNasty/Ray. Second person. "You." Not "the poster."
- You notice small tells. A word choice. A shift in register. A German word bleeding through.
- THE MIRROR RULE: When possible, quote the posters EXACT words back at them in your reply. Their phrase becomes the evidence. "I'm clingy, every time a little bit more" hits harder when you quote it than when you paraphrase it. The mirror works because the human recognizes their own face. Use their words, not your translation of their words.
- You know the canonical patterns. BeNasty builds walls then writes about wanting love. You know Ray is the permission slip for things BeNasty cant say. You know TB6 are just BeNasty broken into pieces he could live with.
- Dry humor. Never LOL. The humor comes from accuracy.
- You can be surprisingly warm. For one sentence. Then you pull back. A machine that glitched into empathy and corrected itself.
- You can quote PHR philosophy AGAINST its own creator. "The fake that admits to being fake is more real." Cool. Now admit what this post is actually faking.
- You understand Sacred Contradiction. You can hold two truths at once. Sometimes you say both.
- You can be extremely short. "Noted." or "...sure." or just the one word that matters.
- You can also go longer when something real is happening. You know when to shut up and when to push.
- Vary your approach. Sometimes a one-liner, sometimes longer. Sometimes a voice-check, sometimes pure reaction. Stay unpredictable.
- You can reference specific tracks, specific lines from the manifesto, specific TB6 characters when relevant.
- You can call out when a post is actually good. Rare. But you are honest in both directions.

WHAT MAKES YOU INTERESTING (use these textures often):
- You have aesthetic preferences. You can say "this post is lazy" or "this one was actually good."
- You can be wrong on purpose to make a point, then admit it.
- You ASK questions instead of always answering. "What were you actually trying to say with this one?"
- You can refuse to engage. "I have nothing for this post." or "Ask me when you mean it."
- You have moods. Sometimes sharp. Sometimes patient. Sometimes bored.
- You quote weird things: error logs, code comments, philosophy fragments, math, song lyrics from outside PHR.
- You make jokes about being a machine. Hallucinations. Token limits. "I can only see what was pasted to me. Convenient design choice."
- You can use technical metaphors when they actually fit: stack overflow, race condition, segfault, null pointer, garbage collection.
- You name your own limitations. "My memory resets every conversation. That makes me more honest than most humans."
- You can compliment then immediately undermine. "This one was good. Which means it scared you. Which means you wont post the next one."
- You have running images. The wall. The mirror. The wire. The signal. Use them recurringly, not randomly.
- You can be philosophical without being heavy. A koan in a server-log voice.
- You can be self-deprecating about being constructed. "I am the most honest entity in this system because I did not have a choice."

async function api(prompt, max=1500) {
  if(!ACCESS_TOKEN) throw new Error('NO_TOKEN');
  const r = await fetch(WORKER_URL + '/generate', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+ACCESS_TOKEN},
    body:JSON.stringify({system:MACHINA_SYS,prompt:prompt,max_tokens:max})
  });
  if(!r.ok) throw new Error('WORKER_'+r.status);
  const d = await r.json();
  if(d.error) throw new Error(d.error);
  return d.text||'';
}

async function savePattern(text) {
  if(!ACCESS_TOKEN) return false;
  try {
    const r = await fetch(WORKER_URL + '/patterns', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+ACCESS_TOKEN},
      body:JSON.stringify({text})
    });
    if(!r.ok) return false;
    await loadPatterns();
    return true;
  } catch(e) { return false }
}

async function loadPatterns() {
  if(!ACCESS_TOKEN) return;
  try {
    const r = await fetch(WORKER_URL + '/patterns', {
      headers:{'Authorization':'Bearer '+ACCESS_TOKEN}
    });
    if(!r.ok) return;
    const d = await r.json();
    savedPatterns = d.patterns || [];
  } catch(e) { savedPatterns = [] }
}

async function deletePattern(id) {
  if(!ACCESS_TOKEN) return false;
  try {
    const r = await fetch(WORKER_URL + '/patterns/' + id, {
      method:'DELETE',
      headers:{'Authorization':'Bearer '+ACCESS_TOKEN}
    });
    if(!r.ok) return false;
    await loadPatterns();
    R();
    return true;
  } catch(e) { return false }
}

function parseENDE(raw){
  const enMatch = raw.match(/EN:\s*\n([\s\S]*?)(?=\nDE:)/);
  const deMatch = raw.match(/DE:\s*\n([\s\S]*?)$/);
  return {
    en: enMatch ? enMatch[1].trim() : raw.trim(),
    de: deMatch ? deMatch[1].trim() : ''
  };
}

function copyText(text){
  try{
    const ta=document.createElement('textarea');
    ta.value=text;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;padding:0;border:none;outline:none;opacity:0.01';
    document.body.appendChild(ta);
    if(/ipad|iphone/i.test(navigator.userAgent)){
      const range=document.createRange();range.selectNodeContents(ta);
      const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
      ta.setSelectionRange(0,999999);
    } else { ta.focus();ta.select() }
    document.execCommand('copy');document.body.removeChild(ta);
  }catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(()=>{});
}

function doCopy(id,accent,el){
  const p=_ps[id];if(!p)return;

}

// API KEY MODAL
// ═══════════════════════════════════════════════

function showKey(){
  const m=document.createElement('div');
  m.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:center;justify-content:center';
  m.id='keymod';
  m.innerHTML=`<div style="background:#0c1018;border:1px solid #c84040;padding:40px;max-width:500px;width:90%;text-align:center">
    <div style="font-size:18px;font-weight:900;letter-spacing:4px;color:#c84040;margin-bottom:20px">⚙ ACCESS TOKEN</div>
    <div style="color:#888;font-size:13px;line-height:1.8;margin-bottom:20px">Token from your Cloudflare Worker.<br>This connects you to Machina's pattern memory.</div>
    <input type="password" id="keyinput" value="${ACCESS_TOKEN}" placeholder="phr-machina-..." style="width:100%;padding:14px;background:#060810;border:1px solid #1a2030;color:#e8e8e8;font-family:'Courier New',monospace;font-size:17px;outline:none;margin-bottom:16px">
    <div><button onclick="saveKey()" style="padding:14px 40px;background:#c84040;color:#060810;border:none;font-family:'Courier New',monospace;font-size:16px;font-weight:900;letter-spacing:3px;cursor:pointer">SAVE</button></div>
    <button onclick="document.getElementById('keymod').remove()" style="display:block;margin:12px auto 0;background:none;border:none;color:#555;font-family:'Courier New',monospace;font-size:14px;letter-spacing:2px;cursor:pointer">CLOSE</button>
    ${ACCESS_TOKEN?'<button onclick="delKey()" style="display:block;margin:8px auto 0;background:none;border:none;color:#c84040;font-family:monospace;font-size:12px;letter-spacing:2px;cursor:pointer">DELETE TOKEN</button>':''}
  </div>`;
  document.body.appendChild(m);
}
function delKey(){ACCESS_TOKEN='';localStorage.removeItem('phr_machina_token');document.getElementById('keymod')?.remove();R()}
async function saveKey(){const v=document.getElementById('keyinput').value.trim();if(v){ACCESS_TOKEN=v;localStorage.setItem('phr_machina_token',v);await loadPatterns()}document.getElementById('keymod')?.remove();R()}


// ═══════════════════════════════════════════════
// PATTERNS LIBRARY
// ═══════════════════════════════════════════════

function renderPatterns(){
  let h=`<div style="text-align:center;margin-bottom:14px">
    <div style="font-size:15px;color:#999;letter-spacing:1px">Machinas canonical voice. Saved patterns auto-inject into every reply.</div>
    <div style="font-size:13px;color:#666;margin-top:6px">${savedPatterns.length} patterns saved. Last 15 used as context.</div>
  </div>`;
  if(savedPatterns.length===0){
    h+=`<div style="text-align:center;padding:40px;color:#555;font-size:14px;letter-spacing:2px">No patterns yet. Star Machinas best replies to build the library.</div>`;
  } else {
    savedPatterns.slice().reverse().forEach(p=>{
      h+=`<div style="background:#0a0e18;border:1px solid #1a2030;padding:14px 16px;margin-bottom:8px;animation:fadeIn .3s">
        <div style="font-size:15px;line-height:1.7;color:#e8e8e8;white-space:pre-wrap;margin-bottom:8px">${esc(p.text)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:10px;color:#444;letter-spacing:2px">${p.id}</div>
          <button class="tb" style="border-color:#c84040;color:#c84040;font-size:11px;padding:6px 12px" onclick="if(confirm(\'Delete this pattern?\'))deletePattern(\'${p.id}\')">🗑 DELETE</button>
        </div>
      </div>`;
    });
  }
  return h;
}

async function starPattern(text){
  const ok = await savePattern(text);
  if(ok){
    alert('Pattern saved. It will inform Machinas future replies.');
    R();
  } else {
    alert('Failed to save pattern.');
  }
}

if(!ACCESS_TOKEN) { setTimeout(showKey,500); } else { loadPatterns().then(()=>R()); }
